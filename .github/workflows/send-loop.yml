name: arbitrum-send-loop

on:
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours — adjust as you like (min interval is 5 min)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # hard stop just under GitHub's 360-min (6h) job limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node send-loop.js
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          TO_ADDRESS: ${{ secrets.TO_ADDRESS }}
          AMOUNT_ETH: ${{ secrets.AMOUNT_ETH }}
          INTERVAL_MS: ${{ secrets.INTERVAL_MS }}
          MAX_RUNTIME_MIN: "350"   # self-stop 5 min before the job timeout above
